<nav class="modern-navbar navbar navbar-expand-lg navbar-light fixed-top">
  <div class="container-fluid">
    <div class="row justify-content-center w-100">
      <div class="col-lg-10 col-md-11 col-12">
        <div class="navbar-content d-flex align-items-center">
          
          <!-- Logo y nombre de empresa -->
          <a class="navbar-brand d-flex align-items-center" href="/">
            <img [src]="'./assets/images/logos/logotipo.png'" 
                 [alt]="config.companyName" 
                 class="navbar-logo me-2">
          </a>

          <!-- Toggle button para móvil -->
          <button 
            class="navbar-toggler border-0 ms-auto" 
            type="button" 
            (click)="toggleMobileMenu()"
            [attr.aria-expanded]="!isMenuCollapsed"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Menú principal -->
          <div class="collapse navbar-collapse justify-content-center" 
               [class.show]="!isMenuCollapsed" 
               id="navbarNav">
            
            <ul class="navbar-nav main-nav">

              @for (item of mainMenuItems; track item.id) {
                <li class="nav-item" [class.dropdown]="hasChildren(item)">
                  
                  <!-- Elemento sin hijos -->
                  @if (!hasChildren(item)) {
                    <a class="nav-link" 
                       [href]="item.link"
                       (click)="onMenuItemClick(item, $event)">
                       <!-- <i [class]="item.icon"></i> -->
                      {{ item.titleShow }}
                    </a>
                  }

                  <!-- Elemento con dropdown -->
                  @if (hasChildren(item)) {
                    <div ngbDropdown class="d-inline-block">
                      <button class="nav-link dropdown-toggle btn btn-link" 
                              type="button"
                              ngbDropdownToggle
                              id="dropdown-{{ item.id }}">
                        {{ item.titleShow }}
                      </button>
                      
                      <div ngbDropdownMenu 
                           class="dropdown-menu-modern"
                           [attr.aria-labelledby]="'dropdown-' + item.id">
                        @for (child of item.children; track child.id) {
                          <a class="dropdown-item" 
                             [href]="child.link"
                             (click)="onMenuItemClick(child, $event)">
                            {{ child.titleShow }}
                          </a>
                        }
                      </div>
                    </div>
                  }
                </li>
              }
            </ul>
          </div>

          <!-- Carrito de compras -->
          @if (config.cartEnabled) {
            <div class="navbar-cart">
              <button class="btn cart-btn position-relative" 
                      type="button"
                      (click)="onCartClick()">
                <i class="fas fa-shopping-cart"></i>
                @if (cartItemCount > 0) {
                  <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                    {{ cartItemCount }}
                  </span>
                }
              </button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Spacer para compensar la navbar fixed -->
<div class="navbar-spacer"></div>
