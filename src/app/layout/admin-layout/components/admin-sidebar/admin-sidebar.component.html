<aside class="admin-sidebar" [class.collapsed]="collapsed">
  <!-- Logo -->
  <div class="sidebar-header">
    <a routerLink="/" class="logo-link">
      <img src="assets/images/logos/logotipo.png" alt="Fairway" class="logo-full">
      <img src="assets/images/logos/isotipo.png" alt="F" class="logo-icon" onerror="this.style.display='none'">
    </a>
    <button class="btn-collapse" (click)="onToggle()">
      <i class="bi" [class.bi-chevron-left]="!collapsed" [class.bi-chevron-right]="collapsed"></i>
    </button>
  </div>

  <!-- Menu -->
  <nav class="sidebar-nav">
    <ul class="nav-list">
      @for (item of menuItems(); track item.route) {
        <li class="nav-item">
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/member-area/dashboard' }"
            class="nav-link"
            [title]="collapsed ? item.label : ''">
            <i class="bi" [ngClass]="item.icon"></i>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="user-card">
      <img [src]="usuario?.fotoUrl || 'assets/images/agents/default-avatar.jpg'" alt="Avatar" class="user-avatar">
      <div class="user-details">
        <span class="user-name">{{ usuario?.nombre }}</span>
        <span class="user-role">{{ usuario?.rol }}</span>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()" [title]="collapsed ? 'Cerrar sesion' : ''">
      <i class="bi bi-box-arrow-right"></i>
      <span class="logout-label">Cerrar sesion</span>
    </button>
  </div>
</aside>
