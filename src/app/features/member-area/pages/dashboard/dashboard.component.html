<div class="dashboard-wrapper">
  <div class="dashboard-header">
    <img src="assets/images/logos/logotipo.png" alt="Logo" class="logo" />
    <h1>¡Bienvenido, {{ user?.name }}!</h1>
    <span class="user-role">Rol: {{ user?.role }}</span>
    <p class="subtitle">Accede a todas las herramientas y recursos de tu área de miembro.</p>
  </div>
  <div class="dashboard-cards">
    <app-dashboard-card
      [title]="'Capacitación'"
      [description]="'Accede a cursos, formación técnica y recursos exclusivos.'"
      [link]="'/member-area/training'"
      [icon]="'bi bi-mortarboard'"
      [buttonText]="'Ir a capacitación'"
    ></app-dashboard-card>
    <app-dashboard-card
      [title]="'Certificación'"
      [description]="'Gestiona tu estado como instalador certificado y accede a beneficios.'"
      [link]="'/member-area/certification'"
      [icon]="'bi bi-patch-check'"
      [buttonText]="'Ver estado'"
    ></app-dashboard-card>
    <app-dashboard-card
      [title]="'E-commerce'"
      [description]="'Compra productos, herramientas y accede a precios exclusivos.'"
      [link]="'/e-commerce'"
      [icon]="'bi bi-cart4'"
      [buttonText]="'Ir a tienda'"
    ></app-dashboard-card>
    <app-dashboard-card
      [title]="'Soporte y recursos'"
      [description]="'Contacta soporte, descarga manuales y accede a la comunidad.'"
      [link]="'/member-area/support'"
      [icon]="'bi bi-life-preserver'"
      [buttonText]="'Ir a soporte'"
    ></app-dashboard-card>
  </div>
</div>
