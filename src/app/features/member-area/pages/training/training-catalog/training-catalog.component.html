<section class="catalog-container">
  <div class="catalog-header">
    <h2 class="catalog-title">Catálogo de Cursos</h2>
    <div class="catalog-options">
      <input type="text" class="search-input" placeholder="Buscar curso..." [value]="search()" (input)="onSearch($event)" />
      <select class="filter-select" [value]="filter()" (change)="onFilter($event)">
        <option value="all">Todos</option>
        <option value="in-progress">En progreso</option>
        <option value="completed">Completados</option>
      </select>
    </div>
  </div>
  @if (!filteredCourses() || filteredCourses().length === 0) {
    <div class="loading">No se encontraron cursos.</div>
  } @else {
    <div class="courses-grid">
      @for (course of filteredCourses(); track course.id) {
        <div class="course-card">
          <div class="card-image-wrapper">
            <img [src]="course.image" alt="{{ course.title }}" class="card-image" />
            <div class="card-progress">
              <progress [value]="course.progress" max="100"></progress>
              <span class="progress-label">{{ course.progress }}%</span>
            </div>
          </div>
          <div class="card-info">
            <h3 class="card-title">{{ course.title }}</h3>
            <p class="card-desc">{{ course.description }}</p>
            <div class="card-meta">
              <span class="meta-duration"><i class="bi bi-clock"></i> {{ course.duration }} hs</span>
            </div>
          </div>
          <div class="card-actions">
            <button class="btn btn-primary" (click)="goToCourse(course.id)">Ver curso</button>
          </div>
        </div>
      }
    </div>
  }
</section>
