<nav class="sidebar">
  <div class="sidebar-user">
    <span>{{ user?.name }}</span>
  </div>
  <ul>
    @for (item of menuItems(); track item) {
      <li>
        <a [routerLink]="item.route" routerLinkActive="active">
          <i [class]="item.icon"></i>
          {{ item.label }}
        </a>
      </li>
    }
  </ul>
</nav>
