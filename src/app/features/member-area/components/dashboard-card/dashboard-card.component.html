<div class="card">
  @if (icon) {
    <div class="card-icon">
      <i class="{{ icon }}"></i>
    </div>
  }
  <h2>{{ title }}</h2>
  <p>{{ description }}</p>
  @if (link) {
    <a [routerLink]="link" class="btn">{{ buttonText ?? 'Ir' }}</a>
  } @else if (buttonText) {
    <button class="btn" (click)="action.emit()">{{ buttonText }}</button>
  }
</div>
