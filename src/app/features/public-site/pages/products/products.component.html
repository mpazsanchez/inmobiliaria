<!-- Products Page Layout -->
<div class="products-page">
  
  <!-- Page Hero Section -->
  <section class="products-hero">
    <div class="hero-background">
      <div class="geometric-shapes"></div>
    </div>
    
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8 text-center">
          
          <!-- Breadcrumb Navigation -->
          <nav aria-label="breadcrumb" class="hero-breadcrumb">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="/">HOME</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Productos
              </li>
            </ol>
          </nav>

          <!-- Main Content -->
          <div class="hero-content">
            <h1 class="hero-title">Nuestras Soluciones</h1>
            <p class="hero-subtitle">
              Soluciones innovadoras en láminas de control solar para transformar tus espacios
            </p>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Products & Technology Section -->
  <app-products-technology
  [productTypes]="data()?.categories"
    [technicalBenefits]="data()?.featured"
  />

</div>
