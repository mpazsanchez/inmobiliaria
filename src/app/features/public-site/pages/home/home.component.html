@if (homeService.loading()) {
  <div class="d-flex justify-content-center align-items-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
} @else if (homeService.error()) {
  <div class="alert alert-danger text-center my-5">{{ homeService.error() }}</div>
} @else if (homeService.data()) {
  <app-hero-section [data]="homeService.data()!.hero" />
  <app-about-company 
    [companyStats]="homeService.data()!.companyStats"
    [companyInfo]="homeService.data()!.companyInfo"
    [showProgressBars]="homeService.data()!.showProgressBars"
    [skills]="homeService.data()!.skills"
    [contactInfo]="homeService.data()!.contactInfo"
    [bannerImage]="homeService.data()!.bannerImage"
  />
  <!-- Agrega aquí más secciones usando homeService.data() -->
}
