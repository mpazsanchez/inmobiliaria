<!-- Hero Section con imagen estática desde API -->
<section class="hero-section">
  <div class="hero-background">
    <div class="hero-overlay"></div>
    @if (!isLoading()) {
      <img
        [src]="heroData.imagenUrl"
        alt="Fairway Inmobiliaria"
        class="hero-image"
        loading="eager"
        fetchpriority="high"
      />
    }
  </div>

  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-title">{{ heroData.titulo }}</h1>
      @if (heroData.subtitulo) {
        <p class="hero-subtitle">{{ heroData.subtitulo }}</p>
      }
    </div>

    <!-- Buscador de Propiedades -->
    <div class="search-container">
      <app-property-search-bar/>
    </div>
  </div>
</section>
