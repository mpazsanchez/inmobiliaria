<!-- Contact Page Layout -->
<div class="contact-page">

  <!-- Hero Section -->
  <app-contact-hero></app-contact-hero>

  <!-- Main Contact Section -->
  <section class="main-contact-section">
    <div class="container">
      <div class="contact-container row g-0">

        <!-- Left Side - Get in Touch Info -->
        <div class="col-lg-6">
          <div class="contact-info-wrapper">
            <div class="section-content">
              <h2 class="section-title">Contactenos</h2>
              <p class="section-description">
                Brindamos nuestros servicios en toda Córdoba y alrededores. Consultá por cobertura en otras zonas.
              </p>

              <div class="contact-info">
                <h5 class="fw-semibold mb-4 contact-info-title">Información de Contacto</h5>

                <div class="d-flex flex-column gap-4">

                  <!-- Dirección -->
                    <div class="d-flex align-items-center gap-4">
                      <span class="fa fa-map-marker-alt contact-icon"></span>
                      <div class="d-flex flex-column">
                        <p class="mb-0 fw-bold">
                          Dirección
                        </p>
                        <p class="info-text-content mb-0">Blvd Las Heras 708, Córdoba Argentina</p>
                      </div>
                    </div>

                    <!-- Email -->
                    <div class="d-flex align-items-center gap-4">
                      <span class="fa fa-envelope contact-icon"></span>

                      <div class="d-flex flex-column">
                        <p class="mb-0 fw-bold">
                          Email
                        </p>
                        <p class="info-text-content mb-0">contacto&#64;glazing.com</p>
                      </div>
                    </div>

                    <!-- Teléfono -->
                    <div class="d-flex align-items-center gap-4">
                      <span class="fa fa-phone contact-icon"></span>

                      <div class="d-flex flex-column">
                        <p class="mb-0 fw-bold">
                          Teléfono
                        </p>
                        <p class="info-text-content mb-0">+54 9 351 123-4567</p>
                      </div>
                    </div>

                </div>

              </div>

            </div>
          </div>
        </div>

        <!-- Right Side - Map -->
        <div class="col-lg-6">
          <div class="map-wrapper">
            <div class="map-placeholder">
              <iframe title="Glazing Location Map"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3404.584!2d-64.19478!3d-31.40557!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a28cb2b5d2f3%3A0x5e8b9c0d1e2f3a4b!2sPolarizados%20C%C3%B3rdoba%2C%20Blvd.%20Las%20Heras%20708%2C%20C%C3%B3rdoba%2C%20Argentina!5e0!3m2!1ses!2sar!4v1725545200000!5m2!1ses!2sar"
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
              </iframe>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-form-section">
    <div class="container">
      <app-contact-form></app-contact-form>
    </div>
  </section>

</div>
