<!-- Contact Page Layout -->
<div class="contact-page">
  
  <!-- Hero Section -->
  <app-contact-hero></app-contact-hero>
  
  <!-- Main Contact Section -->
  <section class="main-contact-section">
    <div class="container">
      <div class="row g-0">
        
        <!-- Left Side - Get in Touch Info -->
        <div class="col-lg-6">
          <div class="contact-info-wrapper">
            <div class="section-content">
              <h2 class="section-title">Get in Touch</h2>
              <p class="section-description">
                Atendemos toda Córdoba  y alrededores. Consultá por cobertura en otras zonas.
              </p>
              
              <app-contact-info></app-contact-info>
            </div>
          </div>
        </div>
        
        <!-- Right Side - Map -->
        <div class="col-lg-6">
          <div class="map-wrapper">
            <div class="map-placeholder">
              <iframe 
                title="Glazing Location Map"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.8354345093747!2d144.9537353153167!3d-37.8162799797517!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6ad65d4c2b349649%3A0xb6899234e561db11!2sEnvato!5e0!3m2!1sen!2sau!4v1635820048621!5m2!1sen!2sau"
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
              </iframe>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="contact-form-section">
    <div class="container">
      <app-contact-form></app-contact-form>
    </div>
  </section>
  
</div>
