<!-- Contact Form Section -->
<div class="contact-form-wrapper">
  <div class="form-container">
    
    <!-- Form Header -->
    <div class="form-header">
      <h2 class="form-title">Let's Get In Touch</h2>
      <p class="form-subtitle">
        Your email address will not be published. Required fields are marked *
      </p>
    </div>

    <!-- Contact Form -->
    <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="contact-form">
      
      <div class="row">
        <!-- Name Field -->
        <div class="col-md-6 mb-4">
          <div class="form-group">
            <input 
              type="text" 
              class="form-control" 
              id="name"
              formControlName="name"
              placeholder="Your Name*"
              [class.is-invalid]="isFieldInvalid('name')">
            <div class="invalid-feedback" *ngIf="isFieldInvalid('name')">
              Name is required
            </div>
          </div>
        </div>

        <!-- Email Field -->
        <div class="col-md-6 mb-4">
          <div class="form-group">
            <input 
              type="email" 
              class="form-control" 
              id="email"
              formControlName="email"
              placeholder="Your Email*"
              [class.is-invalid]="isFieldInvalid('email')">
            <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
              <span *ngIf="contactForm.get('email')?.errors?.['required']">Email is required</span>
              <span *ngIf="contactForm.get('email')?.errors?.['email']">Please enter a valid email</span>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <!-- Phone Field -->
        <div class="col-md-6 mb-4">
          <div class="form-group">
            <input 
              type="tel" 
              class="form-control" 
              id="phone"
              formControlName="phone"
              placeholder="Phone*"
              [class.is-invalid]="isFieldInvalid('phone')">
            <div class="invalid-feedback" *ngIf="isFieldInvalid('phone')">
              Phone is required
            </div>
          </div>
        </div>

        <!-- Subject Field -->
        <div class="col-md-6 mb-4">
          <div class="form-group">
            <input 
              type="text" 
              class="form-control" 
              id="subject"
              formControlName="subject"
              placeholder="Subject*"
              [class.is-invalid]="isFieldInvalid('subject')">
            <div class="invalid-feedback" *ngIf="isFieldInvalid('subject')">
              Subject is required
            </div>
          </div>
        </div>
      </div>

      <!-- Message Field -->
      <div class="row">
        <div class="col-12 mb-4">
          <div class="form-group">
            <textarea 
              class="form-control" 
              id="message"
              formControlName="message"
              rows="6"
              placeholder="Write Message*"
              [class.is-invalid]="isFieldInvalid('message')"></textarea>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('message')">
              Message is required
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="text-left">
        <button 
          type="submit" 
          class="btn btn-primary btn-submit"
          [disabled]="contactForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
          {{ isSubmitting ? 'SENDING...' : 'SEND MESSAGE' }}
        </button>
      </div>

    </form>

  </div>
</div>
