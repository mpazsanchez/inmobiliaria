<div class="contact-info">
  <div class="info-title">Información de Contacto</div>
  <div class="contact-items">
    <div class="contact-item">
      <div class="contact-icon"><i class="fa fa-map-marker-alt"></i></div>
      <div class="contact-details">
        <div class="contact-label">Dirección</div>
        <div class="contact-value">{{ info.address }}</div>
      </div>
    </div>
    <div class="contact-item">
      <div class="contact-icon"><i class="fa fa-envelope"></i></div>
      <div class="contact-details">
        <div class="contact-label">Email</div>
        <div class="contact-value">{{ info.email }}</div>
      </div>
    </div>
    <div class="contact-item">
      <div class="contact-icon"><i class="fa fa-phone"></i></div>
      <div class="contact-details">
        <div class="contact-label">Teléfono</div>
        <div class="contact-value">{{ info.phone }}</div>
      </div>
    </div>
  </div>
</div>
