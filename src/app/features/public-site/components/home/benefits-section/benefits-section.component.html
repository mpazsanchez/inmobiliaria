<section class="benefits-section">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-md-11 col-12">
        
        <!-- Problems Section -->
        <div class="problems-section">
          <div class="row">
            <div class="col-lg-6 col-md-12 mb-4">
              <div class="problems-content">
                <h2 class="problems-title">{{ problemsAndSolutions.headline }}</h2>
                <div class="problems-list">
                  <div class="problem-item" *ngFor="let problem of problemsAndSolutions.problems">
                    <div class="problem-icon">
                      <i [class]="problem.icon"></i>
                    </div>
                    <div class="problem-text">
                      <h4>{{ problem.question }}</h4>
                      <p>{{ problem.description }}</p>
                    </div>
                  </div>
                </div>
                <p class="problems-conclusion">{{ problemsAndSolutions.subheadline }}</p>
              </div>
            </div>
            
            <!-- Solution Section -->
            <div class="col-lg-6 col-md-12">
              <div class="solution-content">
                <div class="solution-header">
                  <span class="solution-subtitle">{{ problemsAndSolutions.solution.subtitle }}</span>
                  <h3 class="solution-title">{{ problemsAndSolutions.solution.title }}</h3>
                </div>
                
                <div class="benefits-grid">
                  <div class="benefit-item" *ngFor="let benefit of problemsAndSolutions.solution.benefits">
                    <div class="benefit-icon">
                      <i [class]="benefit.icon"></i>
                    </div>
                    <div class="benefit-text">
                      <span class="benefit-highlight">{{ benefit.highlight }}</span>
                      <p>{{ benefit.text }}</p>
                    </div>
                  </div>
                </div>
                
                <!-- CTA Buttons -->
                <div class="benefits-cta">
                  <button 
                    class="btn btn-primary benefits-btn-primary"
                    (click)="onRequestQuote()">
                    <i class="fas fa-calculator me-2"></i>
                    {{ problemsAndSolutions.cta.primary }}
                  </button>
                  
                  <button 
                    class="btn btn-outline-primary benefits-btn-secondary"
                    (click)="onGetPricing()">
                    <i class="fas fa-home me-2"></i>
                    {{ problemsAndSolutions.cta.secondary }}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</section>
