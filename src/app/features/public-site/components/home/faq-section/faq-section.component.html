<section class="faq-section">
  <div class="container-fluid">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-md-11 col-12">
        
        <div class="row">
          
          <!-- Left Side - Brand Image/Illustration -->
          <div class="col-lg-5 col-md-12 order-lg-1 order-2">
            <div class="faq-visual">
              <div class="brand-illustration">
                <div class="floating-icon">
                  <i class="fas fa-question-circle"></i>
                </div>
                <div class="background-pattern">
                  <div class="pattern-circle"></div>
                  <div class="pattern-lines"></div>
                </div>
                <div class="glazing-logo">
                  <img src="./assets/images/logos/logotipo.png" alt="Glazing Logo" class="logo-img">
                </div>
              </div>
            </div>
          </div>
          
          <!-- Right Side - FAQ Content -->
          <div class="col-lg-7 col-md-12 order-lg-2 order-1">
            <div class="faq-content">
              
              <!-- FAQ Header -->
              <div class="faq-header">
                <span class="section-badge">PREGUNTAS FRECUENTES</span>
                <h2 class="faq-title">¿Tienes alguna pregunta sobre nuestras láminas solares?</h2>
                <p class="faq-intro">
                  Encuentra respuestas a las preguntas más comunes sobre nuestros productos y servicios.
                </p>
              </div>
              
              <!-- FAQ Accordion -->
              <div class="faq-accordion">
                <div 
                  class="faq-item" 
                  *ngFor="let faq of faqItems; trackBy: trackByFaqId; let i = index"
                  [class.active]="faq.isOpen">
                  
                  <div class="faq-card">
                    <button 
                      class="faq-question"
                      (click)="toggleFAQ(faq.id)"
                      [attr.aria-expanded]="faq.isOpen"
                      [attr.aria-controls]="'answer-' + faq.id">
                      
                      <span class="question-text">{{ faq.question }}</span>
                      <span class="toggle-icon">
                        <i class="fas" [class.fa-plus]="!faq.isOpen" [class.fa-minus]="faq.isOpen"></i>
                      </span>
                    </button>
                    
                    <div 
                      class="faq-answer"
                      [id]="'answer-' + faq.id"
                      [class.show]="faq.isOpen">
                      <div class="answer-content">
                        <p>{{ faq.answer }}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              
            </div>
          </div>
          
        </div>
        
      </div>
    </div>
  </div>
</section>
